name: Sync to Hugging Face
on:
  push:
    branches:
      - main
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to HF Space
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "Sincronizador HF"
          # Reemplaza TU_USUARIO_HF y TU_SPACE_HF con tus datos reales de Hugging Face
          git remote add hf https://chatliz-online:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/chatliz-online/Chat-Zenith
          git push -f hf main
